<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Absarina's Web</title>
        
        <style>
            /* Main Body Settings with a guarenteed background image */
            body {
                background-image: url('https://i.postimg.cc/XY9n6LZF/IMG-3774.jpg');
                background-repeat: no-repeat; 
                background-position: center;
                background-attachment: fixed;
                background-size: cover;
                min-height: 100vh;
                margin: 0;
                font-family: 'Courier New', monospace;
            }
            /* Container Box */
            .window-container {

                border: 4px solid #000000;
                box-shadow: 4px 4px 0px #000000;

        }

        /* Pink Title Bar */
        .window-header {
            background-color:#ff007f;
            color: #000000;
            padding: 8px 12px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            border-bottom: 4px solid #000000;
            text-transform: uppercase;
        }
            
        /* white writing area */
        .window-body {
            padding: 20px;
            font-family: 'Courier New',monospace;
            color: #000000;
            background-color: #ffffff; 

        }
            
        /* Seperator Line */
        hr {
            border: none;
            border-top: 2px solid #000000;
            margin: 15px 0;
        }
                
        </style>
    </head>

    <body>
